[profile.default]
retries = 0
fail-fast = true
slow-timeout = { period = "10s", terminate-after = 2, grace-period = "2s" }
final-status-level = "slow"

[profile.integration]
retries = 0
fail-fast = false
test-threads = 32
slow-timeout = { period = "20s", terminate-after = 2, grace-period = "5s" }
global-timeout = "20m"
final-status-level = "flaky"

[profile.ci]
retries = 0
fail-fast = false
global-timeout = "30m"
final-status-level = "flaky"

[profile.ci.junit]
path = "junit.xml"
