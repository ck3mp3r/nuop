---
# Config Replicator — Standard Mode Deployment
#
# Runs the operator in Standard mode. The image must bundle the operator script
# under /sources/config-replicator/scripts/.
#
# Build a custom image with the script bundled:
#   FROM ghcr.io/ck3mp3r/nuop:latest
#   COPY scripts/ /sources/config-replicator/scripts/

apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-replicator
  namespace: default
  labels:
    app.kubernetes.io/name: nuop
    app.kubernetes.io/component: operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-replicator
  template:
    metadata:
      labels:
        app: config-replicator
        app.kubernetes.io/name: nuop
    spec:
      serviceAccountName: config-replicator-sa
      containers:
        - name: operator
          image: ghcr.io/ck3mp3r/nuop:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: NUOP_MODE
              value: standard
            - name: NUOP_SOURCES_PATH
              value: /sources
            - name: LOG_LEVEL
              value: info
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
