default_install_hook_types = ["pre-commit", "pre-push"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "end-of-file-fixer" },
  { id = "trailing-whitespace" },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "nix-fmt"
name = "nix fmt"
language = "system"
entry = "nix fmt ."
pass_filenames = false
stages = ["pre-commit"]

[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt"
language = "system"
entry = "cargo fmt --all --manifest-path operator/Cargo.toml"
pass_filenames = false
stages = ["pre-commit"]

[[repos.hooks]]
id = "check-merge-conflicts"
name = "check merge conflicts"
language = "system"
entry = "git diff --check --cached"
pass_filenames = false
stages = ["pre-commit"]

[[repos.hooks]]
id = "clippy"
name = "cargo clippy"
language = "system"
entry = "cargo clippy --manifest-path operator/Cargo.toml --tests -- -D warnings"
pass_filenames = false
stages = ["pre-push"]

[[repos.hooks]]
id = "tests"
name = "cargo nextest"
language = "system"
entry = "cargo nextest run --profile ci --manifest-path operator/Cargo.toml"
pass_filenames = false
stages = ["pre-push"]
